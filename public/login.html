<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Panel Login</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        background: #050014;
        overflow: hidden;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* PLANETS */
    .planet {
        position: absolute;
        border-radius: 50%;
        filter: blur(0.5px);
    }

    .planet.blue {
        width: 260px;
        height: 260px;
        background: radial-gradient(circle, #66aaff, #315eff);
        top: -40px;
        left: -20px;
    }

    .planet.orange {
        width: 150px;
        height: 150px;
        background: radial-gradient(circle, #ffcc66, #ff7b00);
        top: 80px;
        right: 30px;
    }

    .planet.purple {
        width: 170px;
        height: 170px;
        background: radial-gradient(circle, #c08aff, #8b3bff);
        bottom: 40px;
        right: 70px;
        position: absolute;
    }

    .planet.purple::after {
        content: "";
        position: absolute;
        width: 220px;
        height: 70px;
        border: 4px solid rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        top: 50px;
        left: -25px;
        transform: rotate(15deg);
        opacity: 0.6;
    }

    /* STARS */
    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        opacity: 0.7;
    }

    /* LOGIN CARD */
    .login-card {
        width: 85%;
        max-width: 420px;
        background: rgba(20, 0, 50, 0.45);
        padding: 32px;
        border-radius: 20px;
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 0 40px rgba(120, 40, 255, 0.3);
        position: relative;
        z-index: 10;
    }

    .login-card h2 {
        text-align: center;
        color: white;
        font-size: 2rem;
        margin-bottom: 5px;
    }

    .subtitle {
        text-align: center;
        color: #c9c9ff;
        font-size: 0.95rem;
        margin-bottom: 30px;
    }

    label {
        color: #dcdcff;
        font-size: 0.9rem;
        margin-bottom: 6px;
        display: block;
    }

    .input-group {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255,255,255,0.15);
        padding: 12px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        margin-bottom: 18px;
    }

    .input-group i {
        color: #ccc;
        margin-right: 10px;
        font-size: 1.1rem;
    }

    .input-group input {
        background: transparent;
        border: none;
        outline: none;
        color: white;
        font-size: 1rem;
        width: 100%;
    }

    .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, #9b4dff, #4a9fff);
        color: white;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 5px 25px rgba(90,120,255,0.4);
    }

    .btn:active {
        transform: scale(0.98);
    }

    .error-box {
        background: rgba(255, 80, 80, 0.18);
        padding: 10px;
        border-radius: 10px;
        border: 1px solid rgba(255,80,80,0.3);
        margin-bottom: 12px;
        display: none;
        color: #ffbbbb;
        font-size: .9rem;
    }
</style>
</head>

<body>

<!-- PLANETS -->
<div class="planet blue"></div>
<div class="planet orange"></div>
<div class="planet purple"></div>

<!-- STARS -->
<script>
for (let i = 0; i < 120; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.top = Math.random() * 100 + "%";
    s.style.left = Math.random() * 100 + "%";
    s.style.opacity = 0.3 + Math.random();
    document.body.appendChild(s);
}
</script>

<!-- LOGIN CARD -->
<div class="login-card">
    <h2>Galaxy Panel</h2>
    <div class="subtitle">Enter your access to the cosmos</div>

    <div id="errorBox" class="error-box"></div>

    <label>Username</label>
    <div class="input-group">
        <i class="fas fa-user"></i>
        <input id="username" type="text" placeholder="Enter username" autocomplete="off">
    </div>

    <label>Password</label>
    <div class="input-group">
        <i class="fas fa-lock"></i>
        <input id="password" type="password" placeholder="Enter password">
    </div>

    <button class="btn" onclick="login()">Login</button>
</div>

<script>
async function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    const error = document.getElementById("errorBox");

    error.style.display = "none";

    if (!user || !pass) {
        error.textContent = "Fill all fields.";
        error.style.display = "block";
        return;
    }

    try {
        const res = await fetch("/api/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({username: user, password: pass})
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
            error.textContent = data.error || "Incorrect username or password.";
            error.style.display = "block";
            return;
        }

        localStorage.setItem("panelUser", JSON.stringify(data.user));
        window.location.href = "dashboard.html";

    } catch (e) {
        error.textContent = "Failed connecting to server.";
        error.style.display = "block";
    }
}
</script>

</body>
</html>
